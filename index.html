<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>〇×ゲーム</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-container">
      <h1>〇×ゲーム</h1>

      <div class="scoreboard" aria-live="polite">
        <div class="score-box">
          <span class="label">X</span>
          <span id="score-x">0</span>
        </div>
        <div class="score-box">
          <span class="label">O</span>
          <span id="score-o">0</span>
        </div>
        <div class="score-box">
          <span class="label">引き分け</span>
          <span id="score-draw">0</span>
        </div>
      </div>

      <div id="status" class="status">X の番です</div>

      <div id="board" class="board" aria-label="〇×ゲームの盤面">
        <button class="cell" type="button" data-index="0" aria-label="1マス目"></button>
        <button class="cell" type="button" data-index="1" aria-label="2マス目"></button>
        <button class="cell" type="button" data-index="2" aria-label="3マス目"></button>
        <button class="cell" type="button" data-index="3" aria-label="4マス目"></button>
        <button class="cell" type="button" data-index="4" aria-label="5マス目"></button>
        <button class="cell" type="button" data-index="5" aria-label="6マス目"></button>
        <button class="cell" type="button" data-index="6" aria-label="7マス目"></button>
        <button class="cell" type="button" data-index="7" aria-label="8マス目"></button>
        <button class="cell" type="button" data-index="8" aria-label="9マス目"></button>
      </div>

      <button id="reset-button" class="reset-button" type="button">もう1回</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
